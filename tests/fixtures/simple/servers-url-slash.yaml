openapi: 3.0.0
info:
  title: "Test servers/url == /"
  version: '1.0'

servers:
  - url: /

paths:
  '/greeting/{name}':
    post:
      summary: Generate greeting
      description: Generates a greeting message.
      operationId: fakeapi.hello.post_greeting
      responses:
        '200':
          description: greeting response
          content:
            'application/json':
              schema:
                type: object
      parameters:
        - name: name
          in: path
          description: Name of the person to greet.
          required: true
          schema:
            type: string
