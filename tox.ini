# Run all tests:
#   tox
# Run all tests in one file in all test environments:
#   tox -- tests/test_api.py
# Run one test in all test environments:
#   tox -- tests/test_api.py::test_api
# Run all tests in one file in one test environment:
#   tox -e py310 -- tests/test_api.py
# Run one test in one test environment:
#   tox -e py310 -- tests/test_api.py::test_api

[flake8]
exclude=connexion/__init__.py
rst-roles=class,mod,obj
# https://black.readthedocs.io/en/stable/guides/using_black_with_other_tools.html#flake8
# Longest docstring in current code base
max-line-length=137
extend-ignore=E203,RST303

[tox]
requires =
    tox>=4.22
    tox-uv>=1.11
envlist =
    py310-min
    {py310,py311,py312,py313,py314,py315}-pypi
    pre-commit

[gh-actions]
python =
    3.10: py310-min,py310-pypi
    3.11: py311-pypi
    3.12: py312-pypi,pre-commit
    3.13: py313-pypi
    3.14: py314-pypi
    3.15: py315-pypi

[testenv]
setenv=PYTHONPATH = {toxinidir}:{toxinidir}
# Installs with `uv pip` rather than `uv sync`, so dependencies are resolved
# from PyPI when the env is created and the committed uv.lock is ignored. This
# mirrors the old `poetry lock` step and keeps the pypi envs testing the latest
# releases. uv.lock is only used for development and the Read the Docs build.
extras=
    flask
    swagger-ui
    uvicorn
    mock
dependency_groups=
    tests
uv_resolution=
    min: lowest-direct
commands=
    uv pip list
    python -m pytest tests --cov connexion --cov-report term-missing {posargs}

[testenv:pre-commit]
skip_install = true
deps=pre-commit
commands=pre-commit run --all-files --show-diff-on-failure
