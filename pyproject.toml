[project]
name = "connexion"
version = "3.0.dev0"
description = "Connexion - API first applications with OpenAPI/Swagger"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["api", "swagger", "openapi"]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Robbe Sneyders", email = "robbe.sneyders@gmail.com" },
    { name = "Ruwan Lambrichts", email = "ruwan.lambrichts@ml6.eu" },
    { name = "Daniel Grossmann-Kavanagh", email = "me@danielgk.com" },
    { name = "Henning Jacobs", email = "henning.jacobs@zalando.de" },
    { name = "João Santos", email = "joao.santos@zalando.de" },
]
maintainers = [
    { name = "Robbe Sneyders", email = "robbe.sneyders@gmail.com" },
    { name = "Ruwan Lambrichts", email = "ruwan.lambrichts@ml6.eu" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Internet",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "asgiref>=3.4",
    "httpx>=0.23",
    "inflection>=0.3.1",
    "jsonschema>=4.17.3",
    "Jinja2>=3.0.0",
    "python-multipart>=0.0.15",
    "PyYAML>=5.1",
    "requests>=2.27",
    "referencing>=0.12.0",
    "starlette>=0.35",
    "werkzeug>=2.2.1",
]

[project.optional-dependencies]
flask = ["a2wsgi>=1.7", "flask[async]>=2.2"]
swagger-ui = ["swagger-ui-bundle>=1.1.0"]
uvicorn = ["uvicorn[standard]>=0.17.6"]
mock = ["jsf>=0.10.0"]

[project.scripts]
connexion = "connexion.cli:main"

[project.urls]
Repository = "https://github.com/spec-first/connexion"

[dependency-groups]
tests = [
    "pre-commit~=2.21.0",
    "pytest==8.4.2",
    "pytest-asyncio~=0.18.3",
    "pytest-cov~=2.12.1",
]
docs = [
    "sphinx==5.3.0",
    "sphinx_copybutton==0.5.2",
    "sphinx_design==0.4.1",
    "sphinx-rtd-theme==1.2.0",
    "sphinxemoji==0.3.1",
]

[tool.uv]
# Also picked up by setup-uv in CI. Keep in line with the uv-pre-commit rev.
required-version = ">=0.13.5,<0.14"
default-groups = ["tests"]

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning:connexion.*:",
    "ignore::FutureWarning:connexion.*:",
]
asyncio_mode = "auto"

[tool.isort]
profile = "black"

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if t.TYPE_CHECKING:",
    "@t.overload",
]

[[tool.mypy.overrides]]
module = "referencing.jsonschema.*"
follow_imports = "skip"

[[tool.mypy.overrides]]
module = "referencing._core.*"
follow_imports = "skip"
