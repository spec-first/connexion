name: Test pipeline
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@v10.2.0
    - name: Check uv.lock is up to date with pyproject.toml
      run: uv lock --check

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15']
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install uv
      uses: astral-sh/setup-uv@v10.2.0
      with:
        enable-cache: true
    - name: Install dependencies
      run: uv sync --locked --only-group ci --python ${{ matrix.python-version }}
    - name: Test with tox
      run: uv run --no-sync tox
    - name: Coveralls
      run: uv run --no-sync coveralls --service github
      env:
        COVERALLS_PARALLEL: true
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        COVERALLS_FLAG_NAME: test-${{ matrix.python-version }}

  finish-coveralls:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@v10.2.0
    - name: Coveralls Finished
      run: uv run --locked --only-group ci coveralls --service github --finish
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
