ci:
  autoupdate_branch: "main"
  autoupdate_schedule: monthly
  # pre-commit.ci runs hooks without network access, which uv-lock needs. The
  # lock is checked by the `lock` job in GitHub Actions instead.
  skip: [uv-lock]
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
      - id: ruff-format

  # Ruff has no equivalent of flake8-rst-docstrings, so flake8 is kept for the
  # RST checks only. Configured in tox.ini.
  - repo: https://github.com/pycqa/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        files: "^connexion/"
        additional_dependencies:
          - flake8-rst-docstrings==0.2.3

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.1
    hooks:
      - id: mypy
        files: "^connexion/"
        args: ["--ignore-missing-imports", "connexion"]
        additional_dependencies:
          - types-jsonschema
          - types-PyYAML
          - types-requests
        pass_filenames: false

  - repo: https://github.com/astral-sh/uv-pre-commit
    # Keep in line with `required-version` in pyproject.toml
    rev: 0.13.5
    hooks:
      - id: uv-lock
